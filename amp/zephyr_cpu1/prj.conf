# AMP CPU1 configuration: coexist with Linux on CPU0
CONFIG_USE_SWITCH=y
CONFIG_FPU=n
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_GIC_SAFE_CONFIG=y
CONFIG_NOCACHE_MEMORY=y
CONFIG_CACHE_MANAGEMENT=y

# OpenAMP / RPMsg (remote/device role paired with Linux zynq_remoteproc)
CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_SLAVE=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# Linux on CPU0 owns UART0 and Ethernet GEM0; log via remoteproc RSC_TRACE
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_LOG=n
